<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Islam Study</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f9ff;color:#17324d}button{border:0;cursor:pointer;font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;background:#f5f9ff}.splash{position:fixed;inset:0;background:linear-gradient(160deg,#eef8ff,#fff);z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;transition:.4s}.splash.hide{opacity:0;pointer-events:none}.logo{width:120px;height:120px;border-radius:35px;background:#087bd2;color:white;display:grid;place-items:center;margin:auto;font-size:48px;box-shadow:0 12px 30px #087bd233}.splash h1{font-size:42px;margin:18px 0 8px;color:#087bd2}.splash p{margin:7px;font-weight:700}.top{background:#087bd2;color:white;padding:22px 18px;border-radius:0 0 28px 28px}.top h1{margin:0}.top p{margin:6px 0 0;opacity:.9}.wrap{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border-radius:20px;padding:20px;text-align:center;box-shadow:0 5px 18px #1d5f9b12}.card:active{transform:scale(.98)}.icon{font-size:34px;display:block;margin-bottom:8px}.title{font-size:22px;font-weight:800;margin:10px 0 15px}.back{background:#e8f3ff;color:#087bd2;padding:10px 15px;border-radius:14px;margin-bottom:15px}.subject{background:white;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 16px #1d5f9b12}.subject h3{margin:0 0 12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{padding:11px 5px;border-radius:13px;background:#eef7ff;color:#087bd2;font-weight:700}.panel{background:white;border-radius:20px;padding:20px;line-height:1.8}.hidden{display:none}@media(max-width:450px){.actions{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.splash h1{font-size:36px}}
</style></head><body><div class="app"><div id="splash" class="splash"><div><div class="logo">📚</div><h1>Islam Study</h1><p>من صنع إسلام حوسيني</p><p>Développé par Islam Houssaini</p><p style="color:#087bd2;margin-top:22px">بالعلم نرتقي</p></div></div><header class="top"><h1>Islam Study 📚</h1><p>منصة الدراسة والتمارين</p></header><main class="wrap"><section id="home"><div class="title">اختر المرحلة الدراسية</div><div class="grid"><button class="card" onclick="showLevels('الابتدائي')"><span class="icon">🧒</span>الابتدائي</button><button class="card" onclick="showLevels('الثانوي الإعدادي')"><span class="icon">🎓</span>الثانوي الإعدادي</button><button class="card" onclick="showLevels('الثانوي التأهيلي')"><span class="icon">🏫</span>الثانوي التأهيلي</button></div></section><section id="levels" class="hidden"><button class="back" onclick="go('home')">← رجوع</button><div class="title" id="stageTitle"></div><div id="levelGrid" class="grid"></div></section><section id="subjects" class="hidden"><button class="back" onclick="go('levels')">← المستويات</button><div class="title" id="levelTitle"></div><div id="subjectGrid"></div></section><section id="content" class="hidden"><button class="back" onclick="go('subjects')">← المواد</button><div class="title" id="contentTitle"></div><div class="panel" id="contentPanel"></div></section></main></div><script>
const data={
'الابتدائي':['الأول ابتدائي','الثاني ابتدائي','الثالث ابتدائي','الرابع ابتدائي','الخامس ابتدائي','السادس ابتدائي'],
'الثانوي الإعدادي':['الأولى إعدادي','الثانية إعدادي','الثالثة إعدادي'],
'الثانوي التأهيلي':['الجذع المشترك','الأولى بكالوريا','الثانية بكالوريا']};
const subjects=['الرياضيات','اللغة العربية','اللغة الفرنسية','اللغة الإنجليزية','العلوم','الفيزياء والكيمياء','الاجتماعيات','التربية الإسلامية'];
let stage='',level='',subject='';
function showLevels(s){stage=s;document.getElementById('stageTitle').textContent=s;document.getElementById('levelGrid').innerHTML=data[s].map(x=>`<button class="card" onclick='showSubjects(${JSON.stringify(x)})'><span class="icon">🎓</span>${x}</button>`).join('');go('levels')}
function showSubjects(l){level=l;document.getElementById('levelTitle').textContent=l;document.getElementById('subjectGrid').innerHTML=subjects.map((s,i)=>`<div class="subject"><h3>${['📐','📚','🇫🇷','🇬🇧','🌿','⚛️','🌍','🕌'][i]} ${s}</h3><div class="actions"><button onclick='openContent(${JSON.stringify(s)},"الدروس")'>📖 الدروس</button><button onclick='openContent(${JSON.stringify(s)},"التمارين")'>✏️ التمارين</button><button onclick='openContent(${JSON.stringify(s)},"الامتحانات")'>📝 الامتحانات</button></div></div>`).join('');go('subjects')}
function openContent(s,type){subject=s;document.getElementById('contentTitle').textContent=type+' — '+s;document.getElementById('contentPanel').innerHTML=`<h2>📚 ${type}</h2><p><b>${s}</b></p><p>المستوى: ${level}</p><p>هنا ستظهر محتويات ${type} الخاصة بهذه المادة. يمكنك إضافة الدروس والتمارين والامتحانات لاحقًا.</p><hr><p>Islam Study — من صنع إسلام حوسيني</p>`;go('content')}
function go(id){['home','levels','subjects','content'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}
setTimeout(()=>document.getElementById('splash').classList.add('hide'),1800);
</script></body></html>
